server {
    listen 80;
    root /usr/share/nginx/html;
    # Cloudflare Tunnel terminates HTTPS, so keep redirects relative
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /black-empire-census/;
    }

    location / {
        # pages change on every rebuild, so browsers must re-check them
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /black-empire-census/tiles/ {
        expires 30d;
    }
}
